title: Linked List Reversal
helpers: linked_list
functions:
  - name: reverse_list
    doc: "Reverse a singly linked list and return the new head. Nodes have .val and .next."
    params: [{name: head, type: linked_list}]
    returns: linked_list
    cases:
      - {name: five_nodes, args: [[1,2,3,4,5]], expected: [5,4,3,2,1]}
      - {name: two_nodes, args: [[1,2]], expected: [2,1]}
      - {name: hidden_empty, hidden: true, args: [[]], expected: []}
      - {name: hidden_single, hidden: true, args: [[7]], expected: [7]}
      - {name: hidden_long, hidden: true, args: [{gen: range, args: [1, 5000, 1]}], expected: {eval: "list(range(5000, 0, -1))"}}
