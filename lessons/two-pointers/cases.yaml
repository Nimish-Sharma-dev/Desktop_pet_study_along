title: Two Pointers
functions:
  - name: two_sum_sorted
    doc: "nums is sorted ascending. Return [i, j] with i < j and nums[i] + nums[j] == target, or [] if none. Use O(n) time."
    params: [{name: nums, type: int_list}, {name: target, type: int}]
    returns: int_list
    cases:
      - {name: basic, args: [[2,7,11,15], 9], expected: [0,1]}
      - {name: middle_pair, args: [[1,2,4,6,10], 8], expected: [1,3]}
      - {name: outer_pair, args: [[1,3,4,8], 9], expected: [0,3]}
      - {name: no_pair, args: [[1,2,3], 10], expected: []}
      - {name: hidden_empty, hidden: true, args: [[], 5], expected: []}
      - {name: hidden_single_cannot_pair_with_itself, hidden: true, args: [[5], 10], expected: []}
      - {name: hidden_duplicates, hidden: true, args: [[1,1,3,5], 2], expected: [0,1]}
      - {name: hidden_negatives, hidden: true, args: [[-4,-1,0,3,10], -5], expected: [0,1]}
      - {name: hidden_large, hidden: true, args: [{gen: range, args: [0, 300000, 2]}, 1199994], expected: [299998, 299999]}
