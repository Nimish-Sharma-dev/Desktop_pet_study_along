# Tutor daemon config. Override the path with TUTOR_CONFIG=/path/to/file.yaml
server:
  host: 127.0.0.1        # keep local-only
  port: 7777
falkordb: { host: localhost, port: 6379 }
ollama:   { url: "http://localhost:11434", model: "qwen2.5-coder:7b" }

debounce_seconds: 1.5          # quiet time after the last edit before analysis runs
llm_timeout_seconds: 30        # never let a slow model stall the pipeline
min_confidence: 0.25
sleep_after_seconds: 300       # pet falls asleep after this much inactivity
cooldowns:
  bubble_seconds: 15           # N: at most one proactive bubble per N seconds
  same_mistake_minutes: 5      # M: do not repeat the same mistake_id within M minutes
allowlisted_paths:             # only files under these folders are ever processed
  - "~/tutor-lessons"
default_student: local-user

# Flip to false as B / C land their real modules (per module).
mock:
  analysis: true
  tutor: true
  graph: true

voice:
  enabled: false
  hotkey: "ctrl+alt+space"     # hold to talk
  speak_replies: true
  whisper_model: "models/ggml-base.en.bin"
  whisper_cmd: ["whisper-cli", "-m", "{model}", "-f", "{wav}", "-nt", "-np"]
  piper_model: "models/en_US-lessac-medium.onnx"
  piper_cmd: ["piper", "--model", "{model}", "--output_file", "{out}"]
