title: Binary Search
functions:
  - name: binary_search
    doc: "Return the index of target in the sorted, duplicate-free list nums, or -1 if it is absent."
    params: [{name: nums, type: int_list}, {name: target, type: int}]
    returns: int
    cases:
      - {name: found_middle, args: [[1,3,5,7,9], 5], expected: 2}
      - {name: found_first, args: [[1,3,5,7,9], 1], expected: 0}
      - {name: found_last, args: [[1,3,5,7,9], 9], expected: 4}
      - {name: not_found_inside, args: [[1,3,5,7,9], 4], expected: -1}
      - {name: not_found_above, args: [[1,3,5,7,9], 10], expected: -1}
      - {name: hidden_empty, hidden: true, args: [[], 3], expected: -1}
      - {name: hidden_single_found, hidden: true, args: [[4], 4], expected: 0}
      - {name: hidden_single_missing, hidden: true, args: [[4], 7], expected: -1}
      - {name: hidden_two_elements, hidden: true, args: [[1,3], 3], expected: 1}
      - {name: hidden_below_min, hidden: true, args: [[5,6,7], 1], expected: -1}
      - {name: hidden_large, hidden: true, args: [{gen: range, args: [0, 1000000, 1]}, 999999], expected: 999999}
