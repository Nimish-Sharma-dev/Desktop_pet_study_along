bugs:
  - id: store_before_lookup
    patches:
      python:     [{old: "        j = seen.get(target - x)\n        if j is not None:\n            return [j, i]\n        seen[x] = i\n", new: "        seen[x] = i\n        j = seen.get(target - x)\n        if j is not None:\n            return [j, i]\n"}]
      javascript: [{old: "    const j = seen.get(target - nums[i]);\n    if (j !== undefined) return [j, i];\n    seen.set(nums[i], i);\n", new: "    seen.set(nums[i], i);\n    const j = seen.get(target - nums[i]);\n    if (j !== undefined) return [j, i];\n"}]
      go:         [{old: "\t\tif j, ok := seen[target-x]; ok {\n\t\t\treturn []int{j, i}\n\t\t}\n\t\tseen[x] = i\n", new: "\t\tseen[x] = i\n\t\tif j, ok := seen[target-x]; ok {\n\t\t\treturn []int{j, i}\n\t\t}\n"}]
