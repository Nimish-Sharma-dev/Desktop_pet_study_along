extends: ../_templates/system-design-rubric.yaml
axes:
  requirements:
    title: Requirements
    concepts: [requirements_analysis]
    section: [requirement, scope, goals, use case]
    checks:
      - {id: limit_semantics, hint: "who is limited and by what rule", any: ['per (user|client|ip|api key|tenant)', 'limit(s|ed)? (each|per|by)', 'N requests']}
      - {id: rejection, hint: "what happens to extra requests", any: ['429', 'reject', 'throttle', 'drop', 'deny']}
      - {id: distributed, hint: "multiple servers sharing limits", any: ['distributed', 'multiple (servers|nodes|instances)', 'across (servers|nodes|instances)', 'cluster']}
      - {id: non_functional, hint: "overhead / accuracy / availability", any: ['latency', 'overhead', 'accura', 'availability', 'fail[- ](open|closed)']}
      - {id: scale_targets, hint: "concrete scale targets", any: ['\d[\d,.]*\s*(k|m|b|million|billion)?\s*(requests|qps|rps|clients|users|per (second|minute|day))']}
  data_model:
    title: Data model
    concepts: [data_modeling, rate_limiting]
    section: [data model, schema, database, entities]
    checks:
      - {id: counter_key, hint: "what the counter is keyed by", any: ['key\s*(=|:|is|format)', 'client[_ ]?id', 'api[_ ]?key', 'user[_ ]?id', 'composite key']}
      - {id: algorithm, hint: "the limiting algorithm", any: ['token bucket', 'leaky bucket', 'fixed window', 'sliding window', 'sliding log']}
      - {id: state, hint: "what state is stored per client", any: ['tokens', 'timestamp', 'count(er)?', 'last refill', 'window start']}
      - {id: store_choice, hint: "where the state lives", any: ['redis', 'memcache', 'in-memory', 'local memory', 'database', 'dynamo']}
      - {id: atomicity, hint: "atomic updates / expiry", any: ['atomic', 'lua', 'incr', 'ttl', 'expir', 'race', 'compare-and-set']}
  api:
    title: API
    concepts: [api_design]
    section: [api, endpoint, interface, headers]
    checks:
      - {id: check_interface, hint: "how callers ask if a request is allowed", any: ['allow', 'check', 'middleware', 'gateway', 'sidecar', '\bPOST\b', '\bGET\b']}
      - {id: status_429, hint: "the rejection status", any: ['\b429\b', 'too many requests']}
      - {id: retry_after, hint: "telling the client when to retry", any: ['retry-after', 'retry after', 'reset']}
      - {id: limit_headers, hint: "limit headers", any: ['x-ratelimit', 'ratelimit-', 'remaining', 'limit header']}
      - {id: config, hint: "how limits are configured per client/endpoint", any: ['config', 'per[- ]endpoint', 'tier', 'plan', 'rules?']}
