bugs:
  - id: fib_without_base_case
    static: missing_base_case
    full:
      python: |
        def fib(n):
            return fib(n - 1) + fib(n - 2)

        def sum_digits(n):
            if n < 10:
                return n
            return n % 10 + sum_digits(n // 10)
      javascript: |
        function fib(n) {
          return fib(n - 1) + fib(n - 2);
        }
        function sumDigits(n) {
          if (n < 10) return n;
          return (n % 10) + sumDigits(Math.floor(n / 10));
        }
        module.exports = { fib, sumDigits };
      go: |
        package solution

        func Fib(n int) int {
        	return Fib(n-1) + Fib(n-2)
        }

        func SumDigits(n int) int {
        	if n < 10 {
        		return n
        	}
        	return n%10 + SumDigits(n/10)
        }
      java: |
        public class Solution {
            public static int fib(int n) {
                return fib(n - 1) + fib(n - 2);
            }
            public static int sumDigits(int n) {
                if (n < 10) return n;
                return n % 10 + sumDigits(n / 10);
            }
        }
  - id: base_case_returns_zero
    patches:
      python:     [{old: "if n <= 1:\n        return n\n    return fib", new: "if n <= 1:\n        return 0\n    return fib"}]
      javascript: [{old: "if (n <= 1) return n;", new: "if (n <= 1) return 0;"}]
      go:         [{old: "if n <= 1 {\n\t\treturn n", new: "if n <= 1 {\n\t\treturn 0"}]
      java:       [{old: "if (n <= 1) return n;", new: "if (n <= 1) return 0;"}]
